# Static site behind Caddy (Seki) and Cloudflare. TLS ends at Caddy.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;

    include /etc/nginx/security-headers.conf;
    # HSTS is set by Cloudflare or Caddy; enable it there once HTTPS is stable.

    # Health check for Docker and Kanshi-To. Not logged.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets never change: cache for a year.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Browsers ask for favicon.ico even with an SVG icon. Serve the SVG so the
    # request doesn't count as a 404 for fail2ban.
    location = /favicon.ico {
        access_log off;
        try_files /favicon.svg =404;
    }

    location = /.well-known/security.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /rss.xml {
        default_type application/rss+xml;
        try_files $uri =404;
    }

    # HTML pages: short cache so content edits show up quickly.
    location / {
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }
}
