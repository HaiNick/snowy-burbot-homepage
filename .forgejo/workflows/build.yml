# Validates content and builds the site on every push.
# Forgejo Actions uses the GitHub Actions syntax, so this also works in .github/workflows/.
name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: docker
    container: node:26-trixie-slim
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
